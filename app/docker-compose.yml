# Запуск и обновление на VPS: deploy/update.sh (подробно — README.md в корне репозитория).
# Образы сайта и миграций собирает GitHub Actions и публикует в ghcr.io, сервер их только скачивает.
# Версия (коммит) — AVTOSLOT_TAG в .env, её прописывает update.sh после удачного обновления.
# Собрать образы на самом сервере (только на крайний случай, 10-15 минут и почти вся память):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --profile tools build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: avtoslot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: avtoslot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avtoslot"]
      interval: 5s
      retries: 10

  # Одноразовый запуск миграций: docker compose run --rm migrate
  migrate:
    image: ghcr.io/igorredikultsev-arch/avtoslot:migrate-${AVTOSLOT_TAG:-none}
    pull_policy: never
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://avtoslot:${POSTGRES_PASSWORD}@db:5432/avtoslot
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]

  app:
    image: ghcr.io/igorredikultsev-arch/avtoslot:app-${AVTOSLOT_TAG:-none}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://avtoslot:${POSTGRES_PASSWORD}@db:5432/avtoslot
    depends_on: { db: { condition: service_healthy } }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
