# Запуск на VPS: docker compose up -d --build   (подробно — README.md в корне репозитория)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: avtoslot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: avtoslot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avtoslot"]
      interval: 5s
      retries: 10

  # Одноразовый запуск миграций: docker compose run --rm migrate
  migrate:
    build: { context: ., target: migrator }
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://avtoslot:${POSTGRES_PASSWORD}@db:5432/avtoslot
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://avtoslot:${POSTGRES_PASSWORD}@db:5432/avtoslot
    depends_on: { db: { condition: service_healthy } }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
