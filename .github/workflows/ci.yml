# Проверка каждого пуша: типы, тесты (с базой) и сборка.
# Сервер (deploy/autoupdate.sh) не берёт коммит, пока проверка идёт или если она упала.
name: Проверка

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avtoslot
          POSTGRES_PASSWORD: avtoslot
          POSTGRES_DB: avtoslot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avtoslot"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://avtoslot:avtoslot@localhost:5432/avtoslot_test
      TEST_DATABASE_URL: postgresql://avtoslot:avtoslot@localhost:5432/avtoslot_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npx next build

  docker:
    # Образы как на сервере: миграции и сайт. Сервер не возьмёт коммит, если они не собираются
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target migrator -t avtoslot-migrator app
      - run: docker build --target runner -t avtoslot-app app
      - name: Миграции из образа на чистой базе
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_USER=avtoslot -e POSTGRES_PASSWORD=x -e POSTGRES_DB=avtoslot postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U avtoslot && break; sleep 1; done; sleep 3
          docker run --rm --network t -e DATABASE_URL=postgresql://avtoslot:x@db:5432/avtoslot avtoslot-migrator npx prisma migrate deploy
