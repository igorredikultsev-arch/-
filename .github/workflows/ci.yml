# Проверка каждого пуша: типы, тесты (с базой) и сборка.
# Сервер (deploy/autoupdate.sh) не берёт коммит, пока проверка идёт или если она упала.
name: Проверка

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avtoslot
          POSTGRES_PASSWORD: avtoslot
          POSTGRES_DB: avtoslot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avtoslot"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://avtoslot:avtoslot@localhost:5432/avtoslot_test
      TEST_DATABASE_URL: postgresql://avtoslot:avtoslot@localhost:5432/avtoslot_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
