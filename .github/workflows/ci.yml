# Проверка каждого пуша: типы, тесты (с базой) и сборка Docker-образов.
# Образы публикуются в GitHub Container Registry (ghcr.io), сервер их только скачивает — сам больше ничего не собирает.
# Сервер (deploy/autoupdate.sh) не берёт коммит, пока проверка идёт или если она упала.
name: Проверка

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Один пакет на два образа: app-<коммит> (сайт) и migrate-<коммит> (миграции и служебные скрипты).
# Имя должно совпадать с IMAGE в docker-compose.yml и deploy/update.sh
env:
  IMAGE: ghcr.io/igorredikultsev-arch/avtoslot

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avtoslot
          POSTGRES_PASSWORD: avtoslot
          POSTGRES_DB: avtoslot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avtoslot"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://avtoslot:avtoslot@localhost:5432/avtoslot_test
      TEST_DATABASE_URL: postgresql://avtoslot:avtoslot@localhost:5432/avtoslot_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npx next build

  docker:
    # Образы для сервера: собрать, проверить миграции и запуск сайта, опубликовать.
    # Только после зелёных тестов: нет образа — сервер не обновится, даже если не дозвонился до GitHub API
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Образ миграций
        uses: docker/build-push-action@v6
        with:
          context: app
          target: migrator
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:migrate-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Образ сайта
        uses: docker/build-push-action@v6
        with:
          context: app
          target: runner
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:app-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Миграции и скрипты из образа на чистой базе, запуск сайта
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_USER=avtoslot -e POSTGRES_PASSWORD=x -e POSTGRES_DB=avtoslot postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U avtoslot && break; sleep 1; done; sleep 3
          url=postgresql://avtoslot:x@db:5432/avtoslot
          docker run --rm --network t -e DATABASE_URL=$url "$IMAGE:migrate-$GITHUB_SHA" npx prisma migrate deploy
          # Служебные скрипты из того же образа: на сервере ими создают админа и чистят демо
          docker run --rm --network t -e DATABASE_URL=$url "$IMAGE:migrate-$GITHUB_SHA" npx tsx scripts/create-admin.ts +79990000001 "ci-password-123"
          docker run --rm --network t -e DATABASE_URL=$url "$IMAGE:migrate-$GITHUB_SHA" npx tsx scripts/cleanup-demos.ts
          docker run -d --name app --network t -p 3000:3000 -e DATABASE_URL=$url -e ROOT_DOMAIN=avtoslot.ru \
            -e APP_URL=https://avtoslot.ru "$IMAGE:app-$GITHUB_SHA"
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/login && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:3000/login || { docker logs app; exit 1; }
          curl -fsS -o /dev/null http://localhost:3000/ || { docker logs app; exit 1; }
          echo "Сайт из образа отвечает"

      - name: Публикация в GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:migrate-$GITHUB_SHA"
          docker push "$IMAGE:app-$GITHUB_SHA"
