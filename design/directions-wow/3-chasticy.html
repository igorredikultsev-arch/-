<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Частицы: Шиномонтаж «Колесо»</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* «Частицы»: шина собирается из тысяч светящихся точек, название сервиса выложено точками на боковине.
   Тонкий крупный шрифт, один фиолетовый цвет для действий, янтарь только в самих точках. */
:root{
  --bg:#050507;--fg:#f4f2f7;--muted:#8e8a99;--line:rgba(255,255,255,.09);--card:#0d0c12;--card-2:#16151d;
  --accent:#7c5cff;--on-accent:#fff;--accent-text:#a892ff;
  --f-body:"Geologica",system-ui,sans-serif;--r:22px;--r-ctl:14px;--r-btn:999px;
  --btn-font:500 16px/1 var(--f-body);--chip-font:500 15px/1 var(--f-body);--price-font:500 21px/1 var(--f-body);
  --h2-font:400 26px/1.1 var(--f-body);--h2-track:-.03em;--score-font:300 60px/1 var(--f-body);
}
.top{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:16px 16px 0}
.who{flex:1;min-width:0}.who b{display:block;font-weight:500;font-size:15px}.who span{color:var(--muted);font-size:13px;font-weight:300}
.call{display:grid;place-items:center;width:46px;height:46px;border-radius:999px;border:1px solid var(--line);text-decoration:none;background:rgba(255,255,255,.04)}
.call .num{display:none}
.hero{position:relative;padding:0 16px}
.field{position:relative;height:min(112vw,470px);margin:-30px -16px 0;touch-action:pan-y}
#dots{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-copy{position:relative;z-index:2;margin-top:-34px}
.hero h1{font:300 clamp(40px,11vw,50px)/.98 var(--f-body);letter-spacing:-.055em;margin:0 0 14px}
.hero h1 b{font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14.5px;font-weight:300;margin:0 0 18px}
.meta .r{color:var(--fg);font-weight:500}.meta .r i{color:#ffb829;font-style:normal}.meta .open{color:#9be7b4}
.hero .btn.primary{width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
@media (prefers-reduced-motion:no-preference){
  .hero-copy>*{opacity:0;transform:translateY(16px);filter:blur(6px);animation:up 1.1s cubic-bezier(.22,1,.36,1) forwards}
  .hero-copy>:nth-child(1){animation-delay:1.3s}.hero-copy>:nth-child(2){animation-delay:1.45s}.hero-copy>:nth-child(3){animation-delay:1.6s}
}
@keyframes up{to{opacity:1;transform:none;filter:none}}
.rest h2{font-weight:400}
.book{background:linear-gradient(160deg,#121019,#0b0a10)}
@media (min-width:960px){
  .top{max-width:1200px;margin:0 auto;padding:26px 40px 0}
  .call{width:auto;padding:0 18px;gap:10px;display:inline-flex;align-items:center;height:48px;font-weight:500}.call .num{display:inline}
  .hero{max-width:1200px;margin:0 auto;padding:0 40px;min-height:660px;display:flex;align-items:center}
  .field{position:absolute;inset:-40px -120px 0 34%;height:auto;margin:0}
  .hero-copy{margin:0;max-width:560px}
  .hero h1{font-size:84px;margin-bottom:22px}
  .meta{font-size:16px;margin-bottom:30px}
  .hero .btn.primary{width:auto;min-height:58px;padding:0 28px;font-size:17px}
}
</style>
</head>
<body>
<header class="top">
  <div class="who"><b>Шиномонтаж «Колесо»</b><span>Пермь, ул. Примерная, 12</span></div>
  <a class="call" href="#" aria-label="Позвонить +7 (342) 254-18-73"><i class="ph ph-phone"></i><span class="num">+7 (342) 254-18-73</span></a>
</header>
<section class="hero">
  <div class="field"><canvas id="dots" aria-hidden="true"></canvas></div>
  <div class="hero-copy">
    <h1>Шиномонтаж <b>без очереди</b></h1>
    <p class="meta"><span class="r"><i>★</i> 4,8</span><span>126 отзывов на картах</span><span class="open">Открыто до 20:00</span></p>
    <a class="btn primary" href="#book">Записаться онлайн<span class="btn-ic"><i class="ph ph-arrow-right"></i></span></a>
  </div>
</section>
<main class="rest" id="rest"></main>

<script src="common.js"></script>
<script>
AS.render(document.getElementById("rest"));
(function () {
  const cv = document.getElementById("dots"), g = cv.getContext("2d");
  const small = innerWidth < 700, TAU = Math.PI * 2;
  const P = []; // x,y,z цели; sx,sy,sz старт; цвет; задержка
  const add = (x, y, z, kind) => P.push({ x, y, z, kind, sx: (Math.random() - 0.5) * 7, sy: (Math.random() - 0.5) * 5, sz: (Math.random() - 0.5) * 6, d: Math.random() * 0.6, ox: 0, oy: 0, vx: 0, vy: 0 });
  // Протектор: точки на беговой дорожке, кроме канавок (тот же рисунок, что у объёмной шины)
  const N = 60, nA = small ? 170 : 240;
  for (let i = 0; i < nA; i++) for (let j = 0; j < 12; j++) {
    const a = (i / nA) * TAU, z = -0.19 + (j / 11) * 0.38, az = Math.abs(z);
    const sh = (a * N) / TAU + az * 6 + (az > 0.07 ? 0.5 : 0);
    if (0.5 - Math.abs((sh % 1) - 0.5) < 0.16 || Math.abs(az - 0.07) < 0.018) continue;
    add(Math.cos(a), Math.sin(a), z, 0);
  }
  // Плечи шины: дуга от протектора к боковине
  for (let i = 0; i < nA; i++) for (const sgn of [-1, 1]) for (let k = 1; k <= 3; k++) {
    const a = (i / nA) * TAU + k * 0.01, t = k / 4, r = 1 - 0.1 * t * t, z = sgn * (0.2 + 0.03 * Math.sin(t * Math.PI / 2));
    add(Math.cos(a) * r, Math.sin(a) * r, z, 1);
  }
  // Боковина: редкие кольца и надпись из точек
  for (const R of [0.63, 0.92]) for (let i = 0; i < (small ? 90 : 130); i++) { const a = (i / (small ? 90 : 130)) * TAU; add(Math.cos(a) * R, Math.sin(a) * R, 0.215, 1); }
  // Объём боковины: редкая «пыль» на её поверхности, спереди и сзади
  for (let i = 0; i < (small ? 600 : 900); i++) { const a = Math.random() * TAU, r = 0.64 + Math.random() * 0.3, zs = Math.random() < 0.6 ? 0.215 : -0.215; add(Math.cos(a) * r, Math.sin(a) * r, zs, 4); }
  // Пыль вокруг колеса
  for (let i = 0; i < (small ? 120 : 220); i++) { const a = Math.random() * TAU, r = 1.15 + Math.random() * 0.9; add(Math.cos(a) * r, Math.sin(a) * r, (Math.random() - 0.5) * 1.6, 5); }
  const T = document.createElement("canvas"), S = 300; T.width = T.height = S; const tg = T.getContext("2d");
  tg.translate(S / 2, S / 2); tg.fillStyle = "#fff"; tg.textAlign = "center"; tg.textBaseline = "middle";
  const ring = (str, size, Rr, bottom) => {
    tg.font = `800 ${size}px Unbounded, sans-serif`; let tot = 0; const ws = [...str].map((c) => { const w = tg.measureText(c).width + size * 0.08; tot += w; return w; });
    let ang = bottom ? tot / Rr / 2 : -tot / Rr / 2;
    [...str].forEach((c, i) => { const d = ws[i] / Rr, mid = bottom ? ang - d / 2 : ang + d / 2; tg.save(); tg.rotate(mid); tg.translate(0, bottom ? Rr : -Rr); tg.fillText(c, 0, 0); tg.restore(); ang += bottom ? -d : d; });
  };
  const textDots = () => {
    ring("ШИНОМОНТАЖ «КОЛЕСО»", 19, 0.77 * S / 2, false); ring("ПЕРМЬ • R13-R22", 13, 0.80 * S / 2, true);
    const im = tg.getImageData(0, 0, S, S).data, step = 2;
    for (let y = 0; y < S; y += step) for (let x = 0; x < S; x += step) if (im[(y * S + x) * 4 + 3] > 128) add((x / S - 0.5) * 2, -(y / S - 0.5) * 2, 0.215, 2);
  };
  // Диск: обод и пять спиц
  for (let i = 0; i < 110; i++) { const a = (i / 110) * TAU; add(Math.cos(a) * 0.6, Math.sin(a) * 0.6, 0.17, 3); add(Math.cos(a) * 0.15, Math.sin(a) * 0.15, 0.05, 3); }
  for (let s = 0; s < 5; s++) for (let k = 0; k < 26; k++) for (const off of [-1, 1]) {
    const r = 0.17 + (k / 25) * 0.41, w = (0.06 - 0.025 * (k / 25)) * off, a0 = (s / 5) * TAU, z = 0.04 + 0.11 * Math.min(1, Math.max(0, (r - 0.12) / 0.44));
    add(Math.cos(a0) * r - Math.sin(a0) * w, Math.sin(a0) * r + Math.cos(a0) * w, z, 3);
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { textDots(); start(); });

  const COL = [[124, 92, 255], [255, 184, 41]];
  let W = 0, H = 0, dpr = 1;
  const fit = () => { const r = cv.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 1.5); W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); };
  fit(); addEventListener("resize", fit);
  let px = -1e4, py = -1e4;
  cv.parentElement.addEventListener("pointermove", (e) => { const r = cv.getBoundingClientRect(); px = e.clientX - r.left; py = e.clientY - r.top; });
  cv.parentElement.addEventListener("pointerleave", () => { px = py = -1e4; });
  const reduce = AS.reduced();
  const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
  function frame(t) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); g.globalCompositeOperation = "lighter";
    const yaw = 0.62 + 0.16 * Math.sin(t * 0.22), pitch = -0.14, spin = t * 0.09;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), cs = Math.cos(spin), ss = Math.sin(spin);
    const scale = Math.min(W, H) * (W > 700 ? 0.42 : 0.4), cx0 = W * (W > 700 ? 0.56 : 0.56), cy0 = H * 0.5;
    for (const p of P) {
      const k = reduce ? 1 : ease((t - p.d) / 2.2);
      // вращение колеса вокруг оси (кроме надписи, она тоже крутится вместе с шиной)
      let x = p.x * cs - p.y * ss, y = p.x * ss + p.y * cs, z = p.z;
      x = p.sx + (x - p.sx) * k; y = p.sy + (y - p.sy) * k; z = p.sz + (z - p.sz) * k;
      // поворот к зрителю и наклон
      let X = x * cy + z * sy, Z = -x * sy + z * cy, Y = y * cp - Z * sp; Z = y * sp + Z * cp;
      const f = 3.2 / (3.2 - Z), sx = cx0 + X * scale * f, syy = cy0 - Y * scale * f;
      // отталкивание от пальца/курсора с пружиной
      const dx = sx - px, dy = syy - py, d2 = dx * dx + dy * dy;
      if (d2 < 6400) { const q = (1 - d2 / 6400) * 2.2; p.vx += (dx / Math.sqrt(d2 + 1)) * q; p.vy += (dy / Math.sqrt(d2 + 1)) * q; }
      p.vx += -p.ox * 0.06; p.vy += -p.oy * 0.06; p.vx *= 0.86; p.vy *= 0.86; p.ox += p.vx; p.oy += p.vy;
      const depth = (Z + 1.2) / 2.4;
      let a = (0.25 + 0.75 * depth) * (0.35 + 0.65 * k);
      if (p.kind === 2) a = Math.min(1, a * 1.6); else if (p.kind === 4) a *= 0.35; else if (p.kind === 5) a *= 0.3 + 0.3 * Math.sin(t * 1.3 + p.d * 20);
      const ang = Math.atan2(p.y, p.x), m = 0.5 + 0.5 * Math.sin(ang + t * 0.4);
      let c;
      if (p.kind === 2) c = [255, 240, 214]; else if (p.kind === 3) c = [210, 205, 255]; else if (p.kind === 4) c = [150, 130, 255]; else if (p.kind === 5) c = [255, 200, 120];
      else c = [COL[0][0] + (COL[1][0] - COL[0][0]) * m * m, COL[0][1] + (COL[1][1] - COL[0][1]) * m * m, COL[0][2] + (COL[1][2] - COL[0][2]) * m * m];
      g.fillStyle = `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;
      const s = (p.kind === 2 ? 1.5 : 1.7) * f;
      g.fillRect(sx + p.ox - s / 2, syy + p.oy - s / 2, s, s);
    }
  }
  let raf = 0, t0 = 0, vis = true;
  function loop(now) { raf = 0; if (!vis || document.hidden) return; if (!t0) t0 = now; frame((now - t0) / 1000); raf = requestAnimationFrame(loop); }
  const FZ = parseFloat(new URLSearchParams(location.search).get("t"));
  function start() {
    if (reduce) { frame(0); return; }
    if (!isNaN(FZ)) { frame(FZ); return; }
    new IntersectionObserver((e) => { vis = e[0].isIntersecting; if (vis && !raf) raf = requestAnimationFrame(loop); }).observe(cv);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && !raf) raf = requestAnimationFrame(loop); });
    raf = requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
